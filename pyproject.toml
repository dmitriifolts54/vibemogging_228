[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibemogging"
version = "0.1.0"
description = "Local video editing with content-addressed history and three-way merging"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vibemogging = "vibemogging.__main__:main"

[tool.setuptools.package-data]
vibemogging = ["static/*"]
